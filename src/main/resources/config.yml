# ========================================== #
#      MagnetEnchant - Configuration         #
#          1.8.8 - 1.21.4+ Universal         #
# ========================================== #

# Language: "en" (English) or "de" (German)
# Can also be changed in-game via /magnet lang <en|de>
language: en

magnet:
  # Wie oft der Magnet-Scan ausgeführt wird (in Server-Ticks, 20 Ticks = 1 Sekunde)
  tick-interval: 3

  # Deaktiviert das Anziehen, wenn der Spieler sneakt (schleicht)
  # Nützlich, um Items für andere Spieler auf den Boden zu werfen
  disable-while-sneaking: true

  # Items nur anziehen, wenn der Spieler auch Platz im Inventar dafür hat
  only-pull-if-inventory-space: true

  # Wo nach der Magnet-Verzauberung gesucht wird
  check-main-hand: true
  check-off-hand: true
  check-armor: true

  # Beim Abbauen von Blöcken:
  # pull-drops-on-block-break: Zieht gedroppte Items sofort zum Spieler
  pull-drops-on-block-break: true
  # instant-block-break-pickup: Legt abgebaute Blöcke direkt ins Inventar des Spielers
  instant-block-break-pickup: false

# Magnet-Stufen, Radien (in Blöcken) und Anzugsgeschwindigkeit
levels:
  1:
    radius: 5.0
    speed: 0.45
  2:
    radius: 8.0
    speed: 0.65
  3:
    radius: 12.0
    speed: 0.85

# Optische und akustische Effekte
effects:
  sound:
    enabled: true
    type: "ENTITY_ITEM_PICKUP"
    volume: 0.4
    pitch: 1.3
  particles:
    enabled: true
    # Mögliche Werte z.B.: PORTAL, ENCHANT, HAPPY_VILLAGER, END_ROD, WISP
    type: "PORTAL"

# Verzauberte Bücher & Fundmöglichkeiten
books:
  # Werkbank-Rezept für Verzaubertes Buch (Magnet I)
  # Rezept: Buch in der Mitte, umgeben von 4 Eisenbarren und 4 Redstone-Staub
  crafting-recipe:
    enabled: true

  # Chance, Magnet-Bücher in Kisten von Dungeons, Minenschächten, Festungen etc. zu finden
  loot-chests:
    enabled: true
    chance: 0.15 # 15% Chance in Loot-Kisten

  # Chance, Magnet I beim Verzaubern am Verzauberungstisch zu erhalten
  enchanting-table:
    enabled: true
    chance: 0.10 # 10% Basis-Chance (skaliert mit höheren Leveln)

  # Dorfbewohner (Bibliothekare): Bieten Magnet-Bücher zum Tausch an
  villager-trades:
    enabled: true
    chance: 0.15 # 15% Chance bei verzauberten Büchern

  # Angeln: Chance, ein Magnet-Buch aus dem Wasser zu fischen
  fishing:
    enabled: true
    chance: 0.20 # 20% Chance wenn ein verzaubertes Buch geangelt wird

  # Piglin-Tauschhandel (Nether): Chance auf Magnet-Bücher beim Gold-Tausch
  piglin-barter:
    enabled: true
    chance: 0.15 # 15% Chance wenn ein Buch ertauscht wird

